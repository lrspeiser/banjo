name: long-physics

# What costs too much to check on every push, run nightly and whenever someone
# asks. The five physics suites labelled `long` in CMakeLists.txt -- the network
# lane's skin, runtime and adaptive suites, the material showcase, and the
# contact capacity suite -- cost a quarter of an hour to an hour each on a fast
# machine, and the skin suite ran past two hours on a Linux build. The record
# suite's plate drop, through the same network lane, took 2,904 s -- 48
# minutes, for two seconds of world -- on a fast desktop. The heated and cold
# beams of the thermal geometry suite follow twenty-five minutes of world
# through heating, fracture, cooling and a second blow. ci.yml leaves all of
# these out; they run here,
# one job each so that no one of them waits on another.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  long-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        suite:
          - network_skin
          - network_runtime
          - network_adaptive
          - material_showcase
          - contact_capacity
          # The owner's heated and cold beams, the heater powers and the room's
          # own build: a minute to four on a fast desktop, as the pieces fall
          # (docs/thermal-mechanics.md).
          - thermal_geometry_long
    steps:
      - uses: actions/checkout@v5

      # HEADLESS brings in banjo_platform, which these suites are built on; it
      # needs no display, unlike the lab. The lab is ON by default, and its
      # raylib looks for X11, which this runner does not have: left on, every
      # job stopped at Configure ("Could NOT find X11"), so nothing here ran.
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBANJO_BUILD_HEADLESS=ON
          -DBANJO_BUILD_LAB=OFF
          -DBANJO_BUILD_TESTS=ON
          -DBANJO_LONG_TEST_TIMEOUT_S=19800

      - name: Build
        run: cmake --build build/ci --parallel 2 --target banjo_${{ matrix.suite }}_tests

      # A name that matches no test fails rather than passing empty, and the
      # JUnit keeps the suite's whole output.
      - name: Test
        run: >-
          ctest --test-dir build/ci --output-on-failure --no-tests=error
          --output-junit ${{ github.workspace }}/long-${{ matrix.suite }}.xml
          --test-output-size-passed 20000000 --test-output-size-failed 20000000
          -R "^banjo_${{ matrix.suite }}_tests$"

      - name: Say what built it
        if: always()
        run: |
          { echo "commit ${{ github.sha }}"; c++ --version | head -n 1; cmake --version | head -n 1; } > toolchain.txt

      # The results, the audit of the build's floating-point model and what
      # built it, kept whether the suite passed or not, under the commit's name.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ matrix.suite }}-${{ github.sha }}
          path: |
            long-${{ matrix.suite }}.xml
            toolchain.txt
            build/ci/Testing/Temporary/LastTest*.log
            build/ci/banjo-fp-profile.json
            build/ci/fp-model-audit-Release.json
          if-no-files-found: warn

  record-plate-drop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBANJO_BUILD_HEADLESS=ON
          -DBANJO_BUILD_LAB=OFF

      - name: Build
        run: cmake --build build/ci --parallel 2 --target banjo_playground_record banjo_platform_cli

      - name: Record a plate drop through the network lane
        env:
          BANJO_RECORD_TIMEOUT_S: "19800"
        run: |
          set -o pipefail
          python3 tests/playground_record_tests.py \
            --recorder build/ci/banjo_playground_record \
            --engine build/ci/banjo_platform_cli -v -k plate 2>&1 | tee record-plate.log

      - name: Say what built it
        if: always()
        run: |
          { echo "commit ${{ github.sha }}"; c++ --version | head -n 1; cmake --version | head -n 1; } > toolchain.txt

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-plate-drop-${{ github.sha }}
          path: |
            record-plate.log
            toolchain.txt
            build/ci/banjo-fp-profile.json
            build/ci/fp-model-audit-Release.json
          if-no-files-found: warn
