name: source-bundle
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-bundle.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assemble pinned JSON dependency
        shell: bash
        run: |
          mkdir -p bundle
          git clone --quiet https://github.com/nlohmann/json.git bundle/nlohmann_json
          git -C bundle/nlohmann_json checkout --quiet 65ee68451d8eb2b5f3a30b410476ab83deb3289b
          git -C bundle/nlohmann_json rev-parse HEAD > bundle/JSON_COMMIT
          tar --exclude=.git -czf banjo-offline-json.tar.gz -C bundle nlohmann_json JSON_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: banjo-offline-json
          path: banjo-offline-json.tar.gz
          retention-days: 7
