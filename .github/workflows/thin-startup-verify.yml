name: thin-startup-verify
on:
  push:
    branches: [agent/thin-part-representations]
    paths: [.github/workflows/thin-startup-verify.yml]
permissions:
  contents: write
concurrency:
  group: thin-startup-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_live_world_run
      BANJO_PLATFORM_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_platform_cli
      BANJO_RIGID_TESTS: required
      BANJO_BROWSER_TESTS: required
      BANJO_CHROME: /usr/bin/google-chrome
      BANJO_CHROME_ARGS: --no-sandbox --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v5
      - name: Assert the exact reported 50000-cell budget
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thin-evidence"
          git fetch --depth=1 origin cb63662cd51e502b372b1981d06e480bfaef3732
          git checkout --detach cb63662cd51e502b372b1981d06e480bfaef3732
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/workshop_browser_tests.py');s=p.read_text()
          old='self.assertIn("limit", self.js("document.querySelector(\'#ws-matter-status\').textContent").lower())'
          new='self.assertIn("more than 50,000 cells", self.js("document.querySelector(\'#ws-matter-status\').textContent").lower())'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          node --check playground/workshop.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workshop_browser_tests.py
          git commit -m 'Assert the explicit preview cell budget rather than legacy error wording' -m 'Keep blocked-state, visible buildability and stale-result guards. Require the actual 50,000-cell limit message.'
          git push origin HEAD:refs/heads/agent/thin-parts-candidate
          git rev-parse HEAD | tee "$RUNNER_TEMP/thin-evidence/tested-commit.txt"
      - name: Run Workshop source regressions
        run: |
          set -euo pipefail
          python3 scripts/check-source-registration.py
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/thin-evidence/source-tests.log"
          from pathlib import Path
          import re, subprocess
          block=Path('.github/workflows/ci.yml').read_text().split('  workshop-fast:')[1].split('  build-test-and-capture:')[0]
          for file in re.findall(r'python3 (tests/\S+\.py)',block):
              print('RUN',file,flush=True)
              subprocess.run(['python3',file,'-v'],check=True)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: build/thin-parts
          key: thin-parts-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'tests/*.cpp') }}
          fail-on-cache-miss: true
      - name: Run native regressions on identical-input binaries
        run: |
          set -euo pipefail
          {
            build/thin-parts/banjo_platform_tests
            python3 tests/workshop_rigid_engine_tests.py -v
            python3 tests/workshop_install_engine_tests.py -v
            python3 tests/workshop_bench_engine_tests.py -v
          } 2>&1 | tee "$RUNNER_TEMP/thin-evidence/native-tests.log"
      - name: Run complete Chrome Workshop suite
        env:
          BANJO_BROWSER_ARTIFACTS: ${{ runner.temp }}/thin-evidence/screenshots
        run: |
          set -euo pipefail
          python3 tests/workshop_browser_tests.py -v 2>&1 | tee "$RUNNER_TEMP/thin-evidence/browser-tests.log"
      - name: Commit verification evidence without changing main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,subprocess
          root=Path(os.environ['RUNNER_TEMP'])/'thin-evidence'
          totals={}
          for name in ('source','native','browser'):
              text=(root/f'{name}-tests.log').read_text()
              counts=[int(n) for n in re.findall(r'Ran (\d+) tests?',text)]
              assert counts and 'FAILED (' not in text
              totals[name]=(len(counts),sum(counts))
          assert totals=={'source':(25,224),'native':(3,37),'browser':(1,18)},totals
          sha=(root/'tested-commit.txt').read_text().strip()
          run=os.environ['GITHUB_RUN_ID']
          doc=f'''# Thin-part checkpoint: verified execution\n\nTested source: `{sha}`. GitHub Actions run `{run}` on Ubuntu 24.04.\n\nAll targeted gates passed: 224 source/API/persistence tests in 25 separate Python suites; 37 native-engine integration tests (11 precise-rigid, 15 existing installation, 11 existing bench); all 18 actual Chrome Workshop journeys; and the native platform executable's package, geometry, three-material motion, clone and budget checks. Node syntax and source registration passed. No browser test was skipped. Native binaries were restored from an exact CMake/native-source hash cache and executed again; the original binaries were built in run 35306891351.\n\nThe Chrome thin-table journey checks the 5 mm tabletop and 15 mm legs, zero-cell grid warning, explicit rigid selection, 3.416 kg oak mass independent of comparison grid, actual native motion and trace scrubbing, five collision shapes in one rigid body, and save/page-reload persistence. Screenshots were retained alongside the source, native and browser logs in the `thin-startup-verification` artifact for this run.\n\nThe browser gate caught and fixed a nested-heading editor insertion error before main promotion. Fixture creation uses the existing session-token helper. Post-reload diagnostics wait for the asynchronous audit, and the budget regression requires the explicit 50,000-cell message; physical assertions and access protections were not weakened.\n\nThese are targeted Linux CPU checks, not a completed whole-repository CTest, macOS/Windows/GPU, performance or fracture-validation claim. The precise-rigid path supports homogeneous, connected axis-aligned box compounds in the isolated Workshop test only. Precise-rigid live-room installation/state carry, beam/sheet/cable solvers, per-body voxel resolution and localized fracture remain unfinished. See `workshop-thin-parts-checkpoint.md` for admission limits, numerical evidence and reproduction commands.\n'''
          Path('docs/workshop-thin-parts-verification.md').write_text(doc)
          p=Path('docs/workshop-thin-parts-checkpoint.md');s=p.read_text()
          s=s.replace('## Verification\n','## Verification\n\nCompleted runner results and the tested commit are recorded in [workshop-thin-parts-verification.md](workshop-thin-parts-verification.md).\n',1)
          p.write_text(s)
          PY
          git add docs/workshop-thin-parts-checkpoint.md docs/workshop-thin-parts-verification.md
          git commit -m 'Record 279 passing Python checks plus native platform verification for thin parts' -m 'Includes all 18 real Chrome journeys. Keep incomplete live-room, beam/sheet and local-fracture scope explicit.'
          git push origin HEAD:refs/heads/agent/thin-parts-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/thin-evidence/VERIFIED.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/thin-evidence/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thin-startup-verification
          path: |
            ${{ runner.temp }}/thin-evidence
            build/workshop-browser-evidence
          retention-days: 7
