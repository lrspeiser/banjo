name: precise-live-verify
on:
  push:
    branches: [agent/rigid-live-integration-tools]
    paths: [.github/workflows/precise-live-verify.yml]
permissions:
  contents: write
concurrency:
  group: precise-live-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/rigid-live/banjo_live_world_run
      BANJO_PLATFORM_ENGINE: ${{ github.workspace }}/build/rigid-live/banjo_platform_cli
      BANJO_PRECISE_LIVE_TESTS: required
      BANJO_RIGID_TESTS: required
      BANJO_BROWSER_TESTS: required
      BANJO_CHROME: /usr/bin/google-chrome
      BANJO_CHROME_ARGS: --no-sandbox --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish reviewed native checkpoint without moving main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/precise-live-evidence"
          cat .agent/precise-live-{0,1,2,3}.b64 | base64 -d | xz -d > "$RUNNER_TEMP/precise-live.patch"
          echo "2ee21e8e2356f63308fd32c5629aa8fc3ad7e28c89309d89182b1a699858714b  $RUNNER_TEMP/precise-live.patch" | sha256sum --check
          git checkout --detach c373ef9e5c9a83b33a6712e4f34028d6232fab07
          git apply --index "$RUNNER_TEMP/precise-live.patch"
          git diff --cached --check
          test "$(git write-tree)" = 8acad8de10b3f484e467fc47afdb0d8b71358077
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Install precise rigid Workshop compounds into the native live world with persistent state' -m 'Preserve millimeter geometry without lattice reconstruction; add native mass/inertia, picking, rendering, held-state and restart support. Reuse staged authoring transactions and idempotency receipts. Restrict mixed rooms to anchored lattice scenery and reject unsupported fracture, thermal, joints and fabrication. Register native live tests and verify actual Workshop-to-world Chrome flow.'
          git push origin HEAD:refs/heads/agent/precise-live-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/precise-live-evidence/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/precise-live-evidence/source.tar.gz"
      - name: Source, API and persistence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check playground/workshop.js
          node --check playground/world.js
          python3 scripts/check-source-registration.py
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/precise-live-evidence/source-tests.log"
          import re, subprocess
          from pathlib import Path
          block=Path('.github/workflows/ci.yml').read_text().split('  workshop-fast:')[1].split('  build-test-and-capture:')[0]
          for file in re.findall(r'python3 (tests/\S+\.py)',block):
              print('RUN',file,flush=True)
              subprocess.run(['python3',file,'-v'],check=True)
          PY
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: build/rigid-live
          key: rigid-live-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt','cmake/**','src/**','tools/**') }}
      - name: Build actual native engines and world tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/rigid-live -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANJO_BUILD_LAB=OFF
          cmake --build build/rigid-live --target banjo_platform_cli banjo_platform_tests banjo_live_world_run banjo_live_world_tests --parallel 2 2>&1 | tee "$RUNNER_TEMP/precise-live-evidence/build.log"
      - uses: actions/cache/save@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: build/rigid-live
          key: rigid-live-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt','cmake/**','src/**','tools/**') }}
      - name: Native geometry, live-world, transaction and state regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            ctest --test-dir build/rigid-live -R 'banjo_precise_rigid_live_tests|banjo_live_world_tests' --output-on-failure
            build/rigid-live/banjo_platform_tests
            python3 tests/workshop_rigid_engine_tests.py -v
            python3 tests/workshop_install_engine_tests.py -v
            python3 tests/workshop_bench_engine_tests.py -v
          } 2>&1 | tee "$RUNNER_TEMP/precise-live-evidence/native-tests.log"
      - name: Required actual Chrome Workshop-to-live-world journeys
        shell: bash
        run: |
          set -euo pipefail
          export BANJO_BROWSER_ARTIFACTS="$RUNNER_TEMP/precise-live-evidence/screenshots"
          python3 tests/workshop_browser_tests.py -v 2>&1 | tee "$RUNNER_TEMP/precise-live-evidence/browser-tests.log"
          git rev-parse HEAD > "$RUNNER_TEMP/precise-live-evidence/VERIFIED.txt"
          echo 'All targeted source, native and Chrome gates passed. Main was not moved by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precise-live-verification
          path: ${{ runner.temp }}/precise-live-evidence
          retention-days: 7
