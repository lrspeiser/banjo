name: test-site-package
on:
  push:
    branches: [codex/staging]
  workflow_dispatch:

concurrency:
  group: test-site-package
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/codex/staging'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install engine dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libngspice0-dev
      - name: Verify registered sources
        run: python3 scripts/check-source-registration.py
      - name: Build the test engine
        run: |
          cmake -S . -B build/test-site -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANJO_BUILD_TESTS=OFF
          cmake --build build/test-site --parallel 2 --target banjo_live_world_run
      - name: Verify routing, saves and authored machines
        run: |
          python3 tests/machine_host_tests.py --engine build/test-site/banjo_live_world_run
          python3 tests/test_site_tests.py --engine build/test-site/banjo_live_world_run
          python3 tests/machine_game_tests.py --engine build/test-site/banjo_live_world_run
      - name: Package committed runtime sources and native engine
        run: python3 scripts/package-test.py --native build/test-site/banjo_live_world_run --output build/banjo-test.tar.gz
      - name: Run the installed runtime package
        run: python3 tests/test_site_tests.py --engine build/test-site/banjo_live_world_run --bundle build/banjo-test.tar.gz
      - name: Publish the immutable test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="banjo-test-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" build/banjo-test.tar.gz --target "$GITHUB_SHA" --prerelease --title "Banjo test build ${GITHUB_SHA:0:7}" --notes "Runtime package for banjo.is/test. Production is unchanged."
          fi
