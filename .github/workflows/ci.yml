name: ci

on:
  push:
  pull_request:

# ON A BRANCH, workshop development is intentionally iterative: a new commit
# makes older runs for the same head branch obsolete, so they are cancelled and
# the newest design gets the runner instead of queueing behind stale
# intermediates.
#
# ON MAIN it is the opposite, and cancelling there quietly cost us every
# verification we had. Each commit on main is a state somebody builds on, and
# build-test-and-capture takes about forty minutes while main is pushed to
# every twenty or thirty -- so each push killed the run before it could finish.
# Measured 2026-09-28: five of main's last six runs ended "Canceling since a
# higher priority waiting request for ci-ci-main exists", two of them inside
# thirty seconds, and main had not completed the long job since 20:04 the day
# before. A cancelled run is not a green one; it is no answer at all.
#
# So main queues instead. Runs there follow one another and every commit gets
# its verdict, later rather than never.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  material-lab-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Compile strict experiment client and validate recording contracts
        run: |
          cd client
          npm ci --ignore-scripts
          npm run check
          npm run build
          cd ..
          node --test tests/material_lab_client_tests.mjs
  runtime-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile, test and lint Rust runtime
        run: |
          cargo test --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

  source-registration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check every source under src/ and tests/ is in a CMake target
        run: python3 scripts/check-source-registration.py
      - name: Rewrite discovery and build identity contracts
        run: |
          python3 tests/regression_runner_tests.py -v
          python3 tests/build_manifest_tests.py -v
          python3 tests/interaction_journal_tests.py -v

  workshop-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check Workshop browser and model
        env:
          OPENAI_API_KEY: ""
        run: |
          python3 tests/material_qa_tests.py -v
          node --check playground/workshop.js
          node --check playground/game_menu.js
          python3 tests/workshop_buildability_tests.py -v
          python3 tests/workshop_rigid_tests.py -v
          python3 tests/workshop_install_tests.py -v
          python3 tests/room_skins_tests.py -v
          python3 tests/workshop_tests.py -v
          python3 tests/workshop_api_tests.py -v
          python3 tests/workshop_store_tests.py -v
          python3 tests/workshop_persistence_api_tests.py -v
          python3 tests/workshop_agent_tests.py -v
          python3 tests/workshop_statics_tests.py -v
          python3 tests/workshop_material_catalog_tests.py -v
          python3 tests/workshop_trials_tests.py -v
          python3 tests/workshop_components_tests.py -v
          python3 tests/workshop_library_tests.py -v
          python3 tests/workshop_rack_tests.py -v
          python3 tests/market_tests.py -v
          python3 tests/workshop_fitting_tests.py -v
          python3 tests/workshop_library_physics_tests.py -v
          python3 tests/workshop_component_api_tests.py -v
          python3 tests/workshop_chat_tests.py -v
          python3 tests/workshop_recipe_contract_tests.py -v
          python3 tests/workshop_local_cells_tests.py Geometry -v
          python3 tests/workshop_tabs_tests.py -v
          python3 tests/workshop_bench_tests.py -v
          python3 tests/workshop_bench_api_tests.py -v
          python3 tests/workshop_graph_tests.py -v
          python3 tests/workshop_component_template_tests.py -v
          python3 tests/workshop_force_tests.py -v
          python3 tests/workshop_product_tests.py -v
          python3 tests/product_graph_contract_tests.py -v
          python3 tests/product_mating_tests.py -v
          python3 tests/product_runtime_tests.py -v
          python3 tests/workshop_construction_tests.py -v
          python3 tests/workshop_construction_api_tests.py -v
          python3 tests/product_breakscreen_tests.py -v
          python3 tests/joint_efficiency_tests.py -v

  build-test-and-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install CPU reference array dependency
        run: python3 -m pip install numpy==2.2.6

      - name: Install visual-lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xvfb

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBANJO_BUILD_LAB=ON
          -DBANJO_BUILD_HEADLESS=ON
          -DBANJO_BUILD_PRECOMPUTE=ON
          -DBANJO_BUILD_TESTS=ON
          -DBANJO_BUILD_RUST_RUNTIME=ON

      - name: Build
        run: cmake --build build/ci --parallel 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test native contact recordings and browser execution contracts
        run: |
          npm ci --ignore-scripts --prefix client
          npm run build --prefix client
          python3 tests/lab_test_hub_tests.py build/ci -v
          python3 tests/material_lab_recording_tests.py build/ci/banjo_material_lab_record -v
          node --test tests/material_lab_client_tests.mjs

      - name: Test core and material laws
        # Suites CMake marks BANJO_BROWSER_TESTS=required (playable recipes, the
        # metal shovel game) drive Chrome too, as the playground step does.
        env:
          BANJO_CHROME: /usr/bin/google-chrome
          BANJO_CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
        run: >-
          ctest --test-dir build/ci --output-on-failure --no-tests=error
          --output-junit ${{ github.workspace }}/ctest-results.xml
          --test-output-size-passed 20000000 --test-output-size-failed 20000000
          -LE "long|performance"

      - name: Test playground HTTP boundary without an API key
        env:
          OPENAI_API_KEY: ""
        run: |
          python3 tests/material_qa_tests.py -v
          node --check playground/workshop.js
          node --check playground/cellmesh.js
          node --check playground/surfaces.js
          python3 tests/cellmesh_tests.py -v
          python3 tests/playground_tests.py -v
          python3 tests/chat_tool_parity_tests.py -v
          python3 tests/playground_control_tests.py -v
          python3 tests/playground_browser_api_tests.py -v
          python3 tests/drop_builder_tests.py -v
          python3 tests/scene_composer_tests.py -v
          python3 tests/planner_proposal_tests.py -v
          python3 tests/playground_archive_tests.py -v
          python3 tests/playground_logging_tests.py -v
          python3 tests/server_failure_detail_tests.py -v
          python3 tests/room_trace_tests.py -v
          python3 tests/room_store_tests.py -v
          python3 tests/ground_transfers_tests.py -v
          python3 tests/access_gate_tests.py -v
          BANJO_LIBRARY=build/ci/libbanjo.so python3 tests/chat_history_tests.py -v
          BANJO_LIBRARY=build/ci/libbanjo.so python3 tests/actions_tests.py -v
          BANJO_LIBRARY=build/ci/libbanjo.so python3 tests/tool_use_tests.py -v
          BANJO_LIBRARY=build/ci/libbanjo.so BANJO_BUILD_DIR=build/ci python3 tests/inventory_tests.py -v
          python3 tests/inventory_model_tests.py -v
          python3 tests/vessels_tests.py -v
          python3 tests/asset_compiler_tests.py -v
          python3 tests/workshop_buildability_tests.py -v
          python3 tests/workshop_rigid_tests.py -v
          python3 tests/workshop_install_tests.py -v
          python3 tests/workshop_tests.py -v
          python3 tests/workshop_api_tests.py -v
          python3 tests/workshop_store_tests.py -v
          python3 tests/workshop_persistence_api_tests.py -v
          python3 tests/workshop_agent_tests.py -v
          python3 tests/workshop_statics_tests.py -v
          python3 tests/workshop_material_catalog_tests.py -v
          python3 tests/workshop_trials_tests.py -v
          python3 tests/workshop_components_tests.py -v
          python3 tests/workshop_library_tests.py -v
          python3 tests/workshop_rack_tests.py -v
          python3 tests/workshop_fitting_tests.py -v
          python3 tests/workshop_library_physics_tests.py -v
          python3 tests/workshop_component_api_tests.py -v
          python3 tests/workshop_chat_tests.py -v
          python3 tests/workshop_recipe_contract_tests.py -v
          python3 tests/workshop_local_cells_tests.py Geometry -v
          python3 tests/workshop_tabs_tests.py -v
          python3 tests/workshop_bench_tests.py -v
          python3 tests/workshop_bench_api_tests.py -v
          python3 tests/workshop_graph_tests.py -v
          python3 tests/workshop_component_template_tests.py -v
          python3 tests/workshop_force_tests.py -v
          python3 tests/workshop_product_tests.py -v
          python3 tests/product_graph_contract_tests.py -v
          python3 tests/product_mating_tests.py -v
          python3 tests/product_runtime_tests.py -v
          python3 tests/workshop_construction_tests.py -v
          python3 tests/workshop_construction_api_tests.py -v
          python3 tests/product_breakscreen_tests.py -v
          python3 tests/joint_efficiency_tests.py -v
          BANJO_LIBRARY=build/ci/libbanjo.so BANJO_BUILD_DIR=build/ci python3 tests/inventory_room_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so \
            python3 tests/machine_room_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/world_upgrades_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/world_seed_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/streamed_regions_server_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/world_hub_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/starter_goals_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/goal_chains_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/ai_player_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/quick_tool_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/world_navigation_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/material_preview_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/item_picture_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/workshop_navigation_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/build_lab_chat_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/voice_browser_tests.py -v
          python3 tests/voice_tests.py -v
          BANJO_LIBRARY=$PWD/build/ci/libbanjo.so python3 tests/knowledge_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/world_clock_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/electric_furnace_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/engines_room_tests.py -v
          BANJO_PLATFORM_ENGINE=$PWD/build/ci/banjo_platform_cli BANJO_RIGID_TESTS=required \
            python3 tests/workshop_rigid_engine_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run \
            python3 tests/workshop_bench_engine_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run \
            python3 tests/workshop_install_engine_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run \
            python3 tests/workshop_test_room_tests.py -v
          python3 tests/workbench_tests.py -v
          python3 tests/playground_connection_tests.py -v
          BANJO_BUILD_DIR=build/ci BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/world_page_journey_tests.py -v
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run \
            BANJO_PLATFORM_ENGINE=$PWD/build/ci/banjo_platform_cli \
            BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --enable-unsafe-swiftshader" \
            BANJO_BROWSER_TESTS=required python3 tests/workshop_browser_tests.py -v
          python3 tests/playground_record_tests.py --recorder build/ci/banjo_playground_record --engine build/ci/banjo_platform_cli -v -k rigid -k output
          # The player regression (tests/player_regression_tests.py: dig, walk, the
          # rover, the Workshop, point and click, played with real input) is run
          # before each push with tools/player_regression.py, not here yet: two of
          # its journeys still pass or fail from run to run (docs/player-regression.md).

      - name: Test generic physics trial contracts
        run: BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_TRIAL_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/physics_trials_tests.py -v

      - name: Verify recorded product use and unsupported rock outcomes
        run: |
          BANJO_TRIAL_ENGINE=$PWD/build/ci/banjo_live_world_run python3 tests/tool_qa_tests.py -v
          python3 scripts/tool_qa.py --engine build/ci/banjo_live_world_run --out build/ci/tool-qa

      - name: Keep tool use results and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-tool-qa-${{ github.sha }}
          path: build/ci/tool-qa/
          if-no-files-found: warn

      - name: Qualify finite-stock fabrication against the native engine
        run: |
          BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            python3 scripts/fabrication_qa.py --engine build/ci/banjo_live_world_run --out build/ci/fabrication-qa
          BANJO_LIVE_ENGINE=$PWD/build/ci/banjo_live_world_run BANJO_LIBRARY=$PWD/build/ci/libbanjo.so BANJO_CHROME=/usr/bin/google-chrome \
            BANJO_CHROME_ARGS="--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
            python3 tests/fabrication_qa_tests.py -v

      - name: Keep fabrication transaction and conservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-fabrication-qa-${{ github.sha }}
          path: build/ci/fabrication-qa/
          if-no-files-found: warn

      - name: Run the mechanics regression suite against the built engine
        run: >-
          python3 scripts/mechanics_qa.py
          --engine build/ci/banjo_live_world_run
          --out build/ci/mechanics-qa

      - name: Keep mechanics recipes, results and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-mechanics-qa-${{ github.sha }}
          path: build/ci/mechanics-qa/
          if-no-files-found: warn

      - name: Record and compare the complete material impact range
        run: >-
          python3 scripts/material_qa.py
          --engine build/ci/banjo_fast_lattice_run
          --out build/ci/material-qa

      - name: Keep material impact reports and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-material-qa-${{ github.sha }}
          path: build/ci/material-qa/
          if-no-files-found: warn

      - name: Generate deterministic scenario projections
        run: |
          ./build/ci/banjo_precompute build/ci/ball-scenarios.csv
          test "$(wc -l < build/ci/ball-scenarios.csv)" -gt 100

      - name: Run headless fracture and rigid-fragment handoff
        run: ./build/ci/banjo_headless

      - name: Render deterministic visual-lab capture
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ./build/ci/banjo_lab \
            --capture build/ci/banjo-fracture.png \
            --frames 210
          test -s build/ci/banjo-fracture.png

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banjo-physics-lab-artifacts
          path: |
            build/ci/banjo-fracture.png
            build/ci/ball-scenarios.csv
          if-no-files-found: error

      - name: Keep the test and floating-point evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-ci-evidence-${{ github.sha }}
          path: |
            ctest-results.xml
            build/ci/banjo-fp-profile.json
            build/ci/fp-model-audit-Release.json
          if-no-files-found: warn
