name: ci

on:
  push:
  pull_request:

# On a branch a new commit makes older runs obsolete, so they are cancelled.
# On main every commit is a state somebody builds on, so runs queue and each
# commit gets its verdict, later rather than never.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  source-registration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check every source under src/ and tests/ is in a CMake target
        run: python3 scripts/check-source-registration.py

  native-tests:
    needs: source-registration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Before configuring: CMake looks for node then, for the page's view test.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the electrical solver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libngspice0-dev

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANJO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Test the engine and non-browser game checks
        # Browser batches run on their own runners below. Every
        # other CTest group and the existing label exclusions stay here.
        env:
          BANJO_CHROME: /usr/bin/google-chrome
          BANJO_CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
          BANJO_BROWSER_TESTS: required
        run: >-
          ctest --test-dir build/ci --output-on-failure --no-tests=error
          --output-junit ${{ github.workspace }}/ctest-results.xml
          --test-output-size-passed 20000000 --test-output-size-failed 20000000
          -LE "long|performance"
          -E "^banjo_machine_game_browser_tests_[0-3]$"

      - name: Keep the test and floating-point evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-ci-evidence-${{ github.sha }}
          path: |
            ctest-results.xml
            build/ci/banjo-fp-profile.json
            build/ci/fp-model-audit-Release.json
          if-no-files-found: warn

  browser-tests:
    needs: source-registration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - name: Install the electrical solver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libngspice0-dev
      - name: Build this revision's game engine
        # Independent runners keep software rendering and native simulations
        # from competing for the same CPU. No runtime artifact is shared.
        run: |
          cmake -S . -B build/browser-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANJO_BUILD_TESTS=OFF
          cmake --build build/browser-engine --parallel 2 --target banjo_live_world_run
      - name: Play browser batch ${{ matrix.shard }} of 8
        env:
          BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/browser-engine/banjo_live_world_run
          BANJO_CHROME: /usr/bin/google-chrome
          BANJO_CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
          BANJO_BROWSER_TESTS: required
        # Retain CMake's 1200-second batch deadline and every Python scenario.
        # Unbuffered output makes progress visible before a batch finishes.
        run: timeout 1200s python3 -u tests/machine_game_browser_tests.py --shard=${{ matrix.shard }}/8

      - name: Keep browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}-${{ github.sha }}
          path: build/ui-proof/browser-failure-*.png
          if-no-files-found: ignore

  build-and-test:
    if: ${{ always() }}
    needs: [source-registration, native-tests, browser-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native check and every browser batch
        env:
          SOURCE_RESULT: ${{ needs['source-registration'].result }}
          NATIVE_RESULT: ${{ needs['native-tests'].result }}
          BROWSER_RESULT: ${{ needs['browser-tests'].result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$BROWSER_RESULT" = success
          echo "Source registration, native checks and all four browser batches passed."
