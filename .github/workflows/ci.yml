name: ci

on:
  push:
  pull_request:

jobs:
  build-test-and-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install visual-lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xvfb

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBANJO_BUILD_LAB=ON
          -DBANJO_BUILD_HEADLESS=ON
          -DBANJO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Test core
        run: ctest --test-dir build/ci --output-on-failure

      - name: Run headless fracture and rigid-fragment handoff
        run: ./build/ci/banjo_headless

      - name: Render deterministic visual-lab capture
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ./build/ci/banjo_lab \
            --capture build/ci/banjo-fracture.png \
            --frames 210
          test -s build/ci/banjo-fracture.png

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: banjo-fracture-preview
          path: build/ci/banjo-fracture.png
          if-no-files-found: error
