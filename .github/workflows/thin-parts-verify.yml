name: thin-parts-verify
on:
  push:
    branches: [agent/thin-part-representations]
    paths: [.github/workflows/thin-parts-verify.yml, .agent/thin-parts-0.b64, .agent/thin-parts-1.b64, .agent/thin-parts-2.b64]
permissions:
  contents: write
concurrency:
  group: thin-parts-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_live_world_run
      BANJO_PLATFORM_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_platform_cli
      BANJO_RIGID_TESTS: required
      BANJO_BROWSER_TESTS: required
      BANJO_CHROME: /usr/bin/google-chrome
      BANJO_CHROME_ARGS: --no-sandbox --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v5
      - name: Verify the exact local checkpoint and integrate latest main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thin-evidence"
          cat .agent/thin-parts-{0,1,2}.b64 | base64 -d | xz -d > "$RUNNER_TEMP/thin.patch"
          echo "b930c5e57308e80ee802c785b006f6b42daffec0743fe021c2527a240df646c1  $RUNNER_TEMP/thin.patch" | sha256sum --check
          git fetch --depth=2 origin b03043ee4a151647b17c2fb91ee197c8292f4878
          git checkout --detach b76502654f3bb5e85a7882362a27398f99667cc6
          git apply --index "$RUNNER_TEMP/thin.patch"
          git diff --cached --check
          test "$(git write-tree)" = 82d5719144226631027bf4ceaae98f519cd82485
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve thin Workshop parts with buildability feedback and explicit precise rigid physics' -m 'Keep continuous source geometry, exact compound mass/inertia and zero-cell native motion. Preserve mechanical intent through save/reopen and refuse unsupported fracture or live installation rather than silently voxelizing. Add source, native and browser regressions; beam/sheet and rigid live-room integration remain explicit future work.'
          git rebase --onto b03043ee4a151647b17c2fb91ee197c8292f4878 b76502654f3bb5e85a7882362a27398f99667cc6
          git diff --check
          git push origin HEAD:refs/heads/agent/thin-parts-candidate
          git rev-parse HEAD | tee "$RUNNER_TEMP/thin-evidence/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/thin-evidence/source.tar.gz"
      - name: Run isolated Workshop source regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check playground/workshop.js
          python3 scripts/check-source-registration.py
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/thin-evidence/source-tests.log"
          from pathlib import Path
          import re, subprocess
          block=Path('.github/workflows/ci.yml').read_text().split('  workshop-fast:')[1].split('  build-test-and-capture:')[0]
          for file in re.findall(r'python3 (tests/\S+\.py)',block):
              print('RUN',file,flush=True)
              subprocess.run(['python3',file,'-v'],check=True)
          PY
      - name: Configure and build native runtimes
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/thin-parts -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANJO_BUILD_LAB=OFF
          cmake --build build/thin-parts --target banjo_platform_cli banjo_platform_tests banjo_live_world_run --parallel 2 2>&1 | tee "$RUNNER_TEMP/thin-evidence/build.log"
      - name: Run actual native geometry, dynamics and installation regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            build/thin-parts/banjo_platform_tests
            python3 tests/workshop_rigid_engine_tests.py -v
            python3 tests/workshop_install_engine_tests.py -v
            python3 tests/workshop_bench_engine_tests.py -v
          } 2>&1 | tee "$RUNNER_TEMP/thin-evidence/native-tests.log"
      - name: Run required Chrome Workshop journeys
        shell: bash
        run: |
          set -euo pipefail
          test -x "$BANJO_CHROME"
          python3 tests/workshop_browser_tests.py -v 2>&1 | tee "$RUNNER_TEMP/thin-evidence/browser-tests.log"
      - name: Mark checkpoint verified without moving main
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/thin-evidence/VERIFIED.txt"
          echo 'Source, native and required Chrome Workshop gates passed. Main was not modified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thin-parts-verification
          path: ${{ runner.temp }}/thin-evidence
          retention-days: 7
