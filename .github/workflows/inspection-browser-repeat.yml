name: inspection-browser-repeat
on:
  push:
    branches: [agent/rigid-live-integration-tools]
    paths: [.github/workflows/inspection-browser-repeat.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/workshop-inspection-integrated
      - uses: actions/cache/restore@v4
        with:
          path: build/rigid-live
          key: rigid-live-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt','cmake/**','src/**') }}
          fail-on-cache-miss: true
      - name: Run entire browser suite with unchanged physical assertions
        env:
          OPENAI_API_KEY: ""
          BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/rigid-live/banjo_live_world_run
          BANJO_PLATFORM_ENGINE: ${{ github.workspace }}/build/rigid-live/banjo_platform_cli
          BANJO_BROWSER_TESTS: required
          BANJO_CHROME: /usr/bin/google-chrome
          BANJO_CHROME_ARGS: --no-sandbox --enable-unsafe-swiftshader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inspection-evidence"
          test "$(git rev-parse HEAD^{tree})" = f158016e06238bd05070e402d6555f08eb5fe9ae
          git rev-parse HEAD > "$RUNNER_TEMP/inspection-evidence/commit.txt"
          export BANJO_BROWSER_ARTIFACTS="$RUNNER_TEMP/inspection-evidence/screenshots"
          python3 tests/workshop_browser_tests.py -v 2>&1 | tee "$RUNNER_TEMP/inspection-evidence/browser-tests.log"
          git rev-parse HEAD > "$RUNNER_TEMP/inspection-evidence/VERIFIED.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-browser-repeat
          path: ${{ runner.temp }}/inspection-evidence
          retention-days: 7
