name: thin-ui-smoke
on:
  push:
    branches: [agent/thin-part-representations]
    paths: [.github/workflows/thin-ui-smoke.yml]
permissions:
  contents: read
jobs:
  thin-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/thin-parts-candidate
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: build/thin-parts
          key: thin-parts-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'tests/*.cpp') }}
      - name: Exercise the actual thin-table UI and native engine
        env:
          OPENAI_API_KEY: ""
          BANJO_LIVE_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_live_world_run
          BANJO_PLATFORM_ENGINE: ${{ github.workspace }}/build/thin-parts/banjo_platform_cli
          BANJO_BROWSER_TESTS: required
          BANJO_CHROME: /usr/bin/google-chrome
          BANJO_CHROME_ARGS: --no-sandbox --enable-unsafe-swiftshader
          BANJO_BROWSER_ARTIFACTS: ${{ runner.temp }}/thin-smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thin-smoke"
          git rev-parse HEAD | tee "$RUNNER_TEMP/thin-smoke/commit.txt"
          test -x "$BANJO_PLATFORM_ENGINE"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/thin-smoke/test.log"
          import sys, os, json, unittest, traceback
          from pathlib import Path
          sys.path.insert(0,'tests')
          import workshop_browser_tests as w
          old_setup=w.WorkshopBrowserRegression.setUp
          def setup(self):
              try:
                  old_setup(self)
              except Exception:
                  if hasattr(self,'page'):
                      events=[e for e in self.page.events if e.get('method') in ('Runtime.exceptionThrown','Runtime.consoleAPICalled','Log.entryAdded','Network.loadingFailed')]
                      print('STARTUP EVENTS:',json.dumps(events,indent=2),flush=True)
                      print('BODY:',self.js('document.body.innerText'),flush=True)
                      self.capture_evidence('startup-failure.png')
                      Path(os.environ['BANJO_BROWSER_ARTIFACTS'],'events.json').write_text(json.dumps(events,indent=2))
                      Path(os.environ['BANJO_BROWSER_ARTIFACTS'],'page.html').write_text(self.js('document.documentElement.outerHTML'))
                  raise
          w.WorkshopBrowserRegression.setUp=setup
          suite=unittest.TestSuite([w.WorkshopBrowserRegression('test_thin_rigid_product_roundtrip_and_actual_native_playback')])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thin-ui-smoke
          path: |
            ${{ runner.temp }}/thin-smoke
            build/workshop-browser-evidence
          retention-days: 7
